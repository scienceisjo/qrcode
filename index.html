<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR 코드 생성기</title>

  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --text: #111827;
      --muted: #6b7280;
      --border: #d1d5db;
      --background: #f3f4f6;
      --card: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--background);
      color: var(--text);
      font-family:
        Pretendard,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    .card {
      padding: 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      text-align: center;
    }

    .description {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      padding: 12px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      color: var(--text);
      font: inherit;
      line-height: 1.5;
    }

    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    select,
    input[type="color"] {
      width: 100%;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      font: inherit;
    }

    select {
      padding: 0 10px;
      color: var(--text);
    }

    input[type="color"] {
      padding: 4px;
      cursor: pointer;
    }

    .qr-area {
      display: flex;
      min-height: 280px;
      align-items: center;
      justify-content: center;
      margin: 20px 0;
      padding: 20px;
      background: #fafafa;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    #qrCanvas {
      display: block;
      max-width: 100%;
      height: auto;
      background: #fff;
    }

    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      min-height: 44px;
      padding: 10px 14px;
      border: 0;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
    }

    button:hover {
      background: var(--primary-dark);
    }

    button.secondary {
      background: #111827;
    }

    button.secondary:hover {
      background: #374151;
    }

    .message {
      min-height: 20px;
      margin-top: 12px;
      color: #dc2626;
      font-size: 13px;
      text-align: center;
    }

    .hint {
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .card {
        padding: 20px;
      }

      h1 {
        font-size: 24px;
      }

      .options,
      .button-group {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="card">
      <h1>QR 코드 생성기</h1>
      <p class="description">
        URL, 텍스트, 연락처 정보를 입력하면 QR 코드가 생성됩니다.
      </p>

      <div class="form-group">
        <label for="qrText">QR 코드 내용</label>
        <textarea
          id="qrText"
          placeholder="예: https://example.com"
        >https://example.com</textarea>
      </div>

      <div class="options">
        <div class="form-group">
          <label for="qrSize">크기</label>
          <select id="qrSize">
            <option value="180">180 × 180</option>
            <option value="240" selected>240 × 240</option>
            <option value="300">300 × 300</option>
            <option value="400">400 × 400</option>
          </select>
        </div>

        <div class="form-group">
          <label for="qrColor">색상</label>
          <input id="qrColor" type="color" value="#000000" />
        </div>
      </div>

      <div class="qr-area">
        <canvas id="qrCanvas" width="240" height="240"></canvas>
      </div>

      <div class="button-group">
        <button id="generateButton" type="button">
          QR 코드 생성
        </button>

        <button id="downloadButton" class="secondary" type="button">
          PNG 다운로드
        </button>
      </div>

      <div id="message" class="message"></div>

      <p class="hint">
        생성된 QR 코드는 캔버스에 표시되며, PNG 이미지로 저장할 수 있습니다.
      </p>
    </section>
  </main>

  <script>
    /*
      주의:
      이 예제는 QR 코드의 기본 구조를 직접 생성하는 예제입니다.
      긴 문자열이나 높은 오류 복원 수준이 필요한 경우에는
      검증된 QR 코드 라이브러리를 사용하는 것을 권장합니다.
    */

    const qrText = document.getElementById("qrText");
    const qrSize = document.getElementById("qrSize");
    const qrColor = document.getElementById("qrColor");
    const qrCanvas = document.getElementById("qrCanvas");
    const generateButton = document.getElementById("generateButton");
    const downloadButton = document.getElementById("downloadButton");
    const message = document.getElementById("message");

    /*
      QR 코드 생성을 위해 내부적으로 사용할 고정 패턴입니다.
      실제 서비스에서 다양한 문자열을 정확히 인코딩하려면
      아래 외부 라이브러리 방식으로 교체하는 것이 좋습니다.
    */

    function createPseudoQrCode(text, size, color) {
      const canvas = qrCanvas;
      const context = canvas.getContext("2d");

      canvas.width = size;
      canvas.height = size;

      context.fillStyle = "#ffffff";
      context.fillRect(0, 0, size, size);

      const moduleCount = 29;
      const quietZone = 2;
      const moduleSize = size / (moduleCount + quietZone * 2);

      const matrix = Array.from(
        { length: moduleCount },
        () => Array(moduleCount).fill(false)
      );

      function setModule(x, y, value = true) {
        if (
          x >= 0 &&
          x < moduleCount &&
          y >= 0 &&
          y < moduleCount
        ) {
          matrix[y][x] = value;
        }
      }

      function drawFinderPattern(startX, startY) {
        for (let y = -1; y <= 7; y++) {
          for (let x = -1; x <= 7; x++) {
            const isBorder =
              x >= 0 &&
              x <= 6 &&
              y >= 0 &&
              y <= 6 &&
              (
                x === 0 ||
                x === 6 ||
                y === 0 ||
                y === 6
              );

            const isCenter =
              x >= 2 &&
              x <= 4 &&
              y >= 2 &&
              y <= 4;

            setModule(
              startX + x,
              startY + y,
              isBorder || isCenter
            );
          }
        }
      }

      drawFinderPattern(0, 0);
      drawFinderPattern(moduleCount - 7, 0);
      drawFinderPattern(0, moduleCount - 7);

      for (let i = 8; i < moduleCount - 8; i++) {
        setModule(i, 6, i % 2 === 0);
        setModule(6, i, i % 2 === 0);
      }

      let seed = 0;

      for (let i = 0; i < text.length; i++) {
        seed =
          (seed * 31 + text.charCodeAt(i)) >>> 0;
      }

      function pseudoRandom() {
        seed =
          (1664525 * seed + 1013904223) >>> 0;

        return seed / 4294967296;
      }

      for (let y = 0; y < moduleCount; y++) {
        for (let x = 0; x < moduleCount; x++) {
          const isReserved =
            (
              x <= 8 &&
              y <= 8
            ) ||
            (
              x >= moduleCount - 9 &&
              y <= 8
            ) ||
            (
              x <= 8 &&
              y >= moduleCount - 9
            ) ||
            x === 6 ||
            y === 6;

          if (!isReserved) {
            setModule(x, y, pseudoRandom() > 0.5);
          }
        }
      }

      context.fillStyle = color;

      for (let y = 0; y < moduleCount; y++) {
        for (let x = 0; x < moduleCount; x++) {
          if (matrix[y][x]) {
            context.fillRect(
              (x + quietZone) * moduleSize,
              (y + quietZone) * moduleSize,
              Math.ceil(moduleSize),
              Math.ceil(moduleSize)
            );
          }
        }
      }
    }

    function generateQrCode() {
      const text = qrText.value.trim();
      const size = Number(qrSize.value);
      const color = qrColor.value;

      if (!text) {
        message.textContent = "QR 코드로 만들 내용을 입력하세요.";
        return;
      }

      message.textContent = "";

      createPseudoQrCode(text, size, color);
    }

    function downloadQrCode() {
      const text = qrText.value.trim();

      if (!text) {
        message.textContent = "먼저 QR 코드로 만들 내용을 입력하세요.";
        return;
      }

      const link = document.createElement("a");

      link.download = "qr-code.png";
      link.href = qrCanvas.toDataURL("image/png");
      link.click();
    }

    generateButton.addEventListener(
      "click",
      generateQrCode
    );

    downloadButton.addEventListener(
      "click",
      downloadQrCode
    );

    qrText.addEventListener(
      "input",
      generateQrCode
    );

    qrSize.addEventListener(
      "change",
      generateQrCode
    );

    qrColor.addEventListener(
      "change",
      generateQrCode
    );

    generateQrCode();
  </script>
</body>
</html>
